name: CI

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      edge-function: ${{ steps.filter.outputs.edge-function }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            android:
              - 'app/**'
              - 'core/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
            edge-function:
              - 'supabase/functions/**'

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Write local.properties (CI placeholder values)
        run: |
          cat > local.properties <<EOF
          SUPABASE_URL=https://ci-placeholder.supabase.co
          SUPABASE_ANON_KEY=ci-placeholder-anon-key
          GOOGLE_WEB_CLIENT_ID=
          EOF
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: ktlint
        run: ./gradlew ktlintCheck
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Debug build
        run: ./gradlew assembleDebug

  deploy-edge-function:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.edge-function == 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: latest
      - name: Deploy ai-proxy
        run: supabase functions deploy ai-proxy --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

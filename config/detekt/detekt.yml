# Built on detekt's default config (buildUponDefaultConfig = true); only overrides live here.
# detekt covers code smells; ktlint (.editorconfig) owns layout, so layout rules stay off here.

complexity:
  CyclomaticComplexMethod:
    # MVI onIntent() is a flat `when` dispatching each Intent to its handler.
    ignoreSimpleWhenEntries: true
  LongMethod:
    # Composable bodies are declarative layout trees; length there isn't the smell it is elsewhere.
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    # ViewModels hold one private handler per Intent, and screen files hold their previews.
    ignorePrivate: true
    ignoreAnnotatedFunctions: ['Preview', 'PreviewLightDark']
    # An implementation's size is its interface's, which is already checked.
    ignoreOverridden: true
    # A Room DAO is one function per query by design.
    ignoreAnnotated: ['Dao']
    # Local data sources mirror their DAOs' surface (habits plus their check-ins).
    allowedFunctionsPerInterface: 15

exceptions:
  SwallowedException:
    excludes: &tests ['**/test/**', '**/androidTest/**']
  TooGenericExceptionCaught:
    # Data-layer wrappers (remoteCall, safeDbCall, ...) deliberately turn any exception into a
    # Result.failure at the boundary, rethrowing CancellationException.
    active: false
  TooGenericExceptionThrown:
    # Test fakes throw RuntimeException to simulate an arbitrary failure.
    excludes: *tests

naming:
  FunctionNaming:
    # Composable functions are PascalCase by official Jetpack Compose convention.
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    ignoreEnums: true
    # Preview sample data isn't shipped logic.
    ignoreAnnotated: ['Preview', 'PreviewLightDark']
  MaxLineLength:
    # ktlint enforces the 120-column limit, including the backtick test-name exemption.
    active: false
  ReturnCount:
    excludeGuardClauses: true

Compose:
  ModifierMissing:
    # A feature's :impl declares its composables internal (house style, "Modules"), so the
    # default only_public would stop checking every screen.
    checkModifiersForVisibility: public_and_internal
  CompositionLocalAllowlist:
    # House style, "Compose and the design system": DsTheme provides the color roles M3 lacks through
    # LocalDsColors, the official Compose pattern for custom colors that differ between themes. Any other
    # new CompositionLocal still fails.
    allowedCompositionLocals: LocalDsColors
